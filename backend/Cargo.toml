[package]
name = "Arandu"
version = "0.6.9"
description = "Arandu: Desktop UI for llama.cpp model management and server launching"
authors = ["Alfredo Fernandes"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "llama_os_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true # Compile your binary in smaller steps.

[profile.release]
codegen-units = 1 # Allows LLVM to perform better optimization.
lto = true # Enables link-time-optimizations.
opt-level = "s" # Prioritizes small binary size. Use `3` if you prefer speed.
panic = "abort" # Higher performance by disabling panic handlers.
strip = true # Ensures debug symbols are removed.

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
tauri = { version = "2.12.1", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2.7.0"
tauri-plugin-fs = "2.6.0"
tauri-plugin-dialog = "2.8.1"
tauri-plugin-shell = "2.4.0"
tauri-plugin-single-instance = "2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
glob = "0.3.4"
regex = "1.13.1"
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.27.0", features = ["v4", "serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
bytes = "1.12.1"
futures-util = "0.3.34"
md5 = "0.8.1"
dirs = "7.0.0"
urlencoding = "2.1"
sysinfo = { version = "0.39.6", features = ["serde"] }
gfxinfo = "0.1.2"
zip = "8.6.0"
url = "2.5.8"
axum = "0.8.9"
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors"] }
hyper = { version = "1.11.1", features = ["full"] }
http-body-util = "0.1.5"

